# GitHub Actionsのworkflowファイルをチェックする
# このファイル以外のすべてのworkflowファイルが実行される前に、このworkflowファイルが実行されるように、
# ワークフローを設計すること。
name: Check workflow files

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache actionlint
        id: cache-actionlint
        uses: actions/cache@v4
        with:
          path: actionlint
          key: actionlint-1.7.9

      - name: Install actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        run: |
          GOBIN=$(pwd) go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.9

      - name: Run actionlint
        run: |
          ./actionlint
