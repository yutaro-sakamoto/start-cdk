# actionlintの新バージョンを確認し、あればPRを自動作成するワークフロー
name: Update actionlint version

on:
  schedule:
    # 毎月1日の午前9時(JST)に実行
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest actionlint version
        id: latest-version
        run: |
          # rhysd/actionlintリポジトリから最新のリリースバージョンを取得
          LATEST_VERSION=$(curl -s https://api.github.com/repos/rhysd/actionlint/releases/latest | jq -r .tag_name)
          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest version: $LATEST_VERSION"

      - name: Get current actionlint version
        id: current-version
        run: |
          # check-workflows.ymlから現在のバージョンを抽出
          CURRENT_VERSION=$(grep -oP 'actionlint@\Kv[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/check-workflows.yml)
          echo "current=v$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: v$CURRENT_VERSION"

      - name: Compare versions
        id: compare
        run: |
          LATEST="${{ steps.latest-version.outputs.latest }}"
          CURRENT="${{ steps.current-version.outputs.current }}"
          
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "New version available: $LATEST (current: $CURRENT)"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date: $CURRENT"
          fi

      - name: Update actionlint version
        if: steps.compare.outputs.update_needed == 'true'
        run: |
          LATEST="${{ steps.latest-version.outputs.latest }}"
          # check-workflows.ymlのバージョンを更新
          sed -i "s/actionlint@v[0-9]\+\.[0-9]\+\.[0-9]\+/actionlint@$LATEST/g" .github/workflows/check-workflows.yml
          sed -i "s/key: actionlint-[0-9]\+\.[0-9]\+\.[0-9]\+/key: actionlint-${LATEST#v}/g" .github/workflows/check-workflows.yml

      - name: Create Pull Request
        if: steps.compare.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: actionlintを${{ steps.latest-version.outputs.latest }}に更新"
          title: "chore: actionlintを${{ steps.latest-version.outputs.latest }}に更新"
          body: |
            actionlintの新バージョン${{ steps.latest-version.outputs.latest }}が利用可能である。
            
            このPRは自動的に作成されたものである。
            
            変更内容:
            - actionlintのバージョンを${{ steps.current-version.outputs.current }}から${{ steps.latest-version.outputs.latest }}に更新
            - キャッシュキーを新バージョンに対応するよう更新
            
            参考: https://github.com/rhysd/actionlint/releases/tag/${{ steps.latest-version.outputs.latest }}
          branch: update-actionlint-${{ steps.latest-version.outputs.latest }}
          delete-branch: true
