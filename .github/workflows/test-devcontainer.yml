# Dev Containerの設定をテストする
name: Test Dev Container

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-devcontainer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run dev container task
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            node --version
            npm --version
            npx tsc --version
            aws --version
            gh --version
          push: never
